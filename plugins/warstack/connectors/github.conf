# GitHub through the gh CLI: warstack's reference connector (docs/connectors.md).
# Copied to ~/.warstack/connectors/github.conf by /warstack:connect, and kept there once the user confirmed it.
# Templates are shell-ready: quote them as shown. <name> marks a value the caller fills in.

match: github.com
via: cli
tool: gh
# What a task reference looks like: #12, owner/repo#12, or the issue's URL.
ref: ^(#|[^ /]+/[^ /]+#)[0-9]+$|^https://github\.com/[^ /]+/[^ /]+/issues/[0-9]+$
# Text that makes the merge close the issue, added to the PR description.
link: Closes <owner>/<repo>#<number>
# A repo with none of these paths has no CI.
ci-config: .github/workflows

op.auth.check: gh auth status
op.issue.read: gh issue view <issue> --comments --json number,title,body,labels,comments,url
op.pr.read: gh pr view <pr> --json title,body,baseRefName,headRefOid,files
op.pr.diff: gh pr diff <pr>
op.pr.list: gh pr list
op.pr.create: gh pr create --base <base> --head <head> --title "<title>" --body-file <file>
opt.pr.create.require: --draft
op.pr.edit: gh pr edit <pr>
op.pr.ready: gh pr ready <pr>
op.pr.merge: gh pr merge <pr>
opt.pr.merge.forbid: --admin --delete-branch -d
op.merge.methods: gh repo view --json squashMergeAllowed,mergeCommitAllowed,rebaseMergeAllowed
op.ci.checks: gh pr checks <branch>
op.ci.watch: gh pr checks <branch> --watch --fail-fast
op.ci.runs: gh run list
op.ci.log: gh run view <run> --log-failed
op.ci.rerun: gh run rerun <run> --failed
op.threads.list: gh api graphql -f 'query=query{repository(owner:"<o>",name:"<r>"){pullRequest(number:<n>){reviewThreads(first:100){nodes{id isResolved path line comments(first:50){nodes{databaseId author{login} body}}}}}}}'
op.thread.reply: gh api -X POST repos/<o>/<r>/pulls/<n>/comments/<c>/replies -f body="<text>"
op.thread.resolve: gh api graphql -F id=<thread> -f 'query=mutation($id:ID!){resolveReviewThread(input:{threadId:$id}){thread{isResolved}}}'
op.thread.owner: gh api graphql -F id=<thread> -f 'query=query($id:ID!){node(id:$id){...on PullRequestReviewThread{pullRequest{url}}}}' --jq .data.node.pullRequest.url
op.review.post: gh api -X POST repos/<o>/<r>/pulls/<n>/reviews --input <file>
op.file.read: gh api repos/<o>/<r>/contents/<path>?ref=<ref>
